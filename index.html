<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState } = React;
        const { createPortal } = ReactDOM;

        function Modal({
            title,
            content,
            show = false,
            onClose = () => {},
            onConfirm = () => {}
        }) {
            return show && ReactDOM.createPortal(
                <div className="modal-container">
                    <div className="modal">
                        <h2>{title}</h2>
                        <p>{content}</p>
                        
                    </div>
                    <div class="confirm">
                        <button onClick={onConfirm}>Conferma</button>
                        <button onClick={onClose}>Annulla</button>
                    </div>
                </div>,
                document.body
            )
        }

        const ReactApp = () => {

            const [animals, setAnimals] = useState([])
            const [show, setShow] = useState(true)

            const animalsChoices = ["Cane", "Gatto", "Pappagallo", "Cavallo", "Panda"];

            function pickRandomAnimal() {
                return Math.floor(Math.random() * 5);
            }

            function addRandomAnimal() {
                const newAnimal = animalsChoices[pickRandomAnimal()]
                setAnimals([
                    ...animals,
                    animalsChoices[pickRandomAnimal()]
                ])
            }

            

            return (
                <>
                    <button onClick={addRandomAnimal}>Aggiungi animale</button>
                    <details>
                        <ul>
                            {animals.map(a => (
                                <li>{a}</li>
                            ))}
                        </ul>
                    </details>
                    <Modal 
                        title="i miei animali preferiti"
                        content={animal}
                        show={show}
                        onClose={() => setShow(false)}
                    />
                </>
            )
        }
    </script>
    <script type="text/babel">
        const { createRoot } = ReactDOM;
        const listaAnimali = document.querySelector(".lista-animali")
        console.log(listaAnimali)
        const root = createRoot(listaAnimali)
        root.render(<ReactApp />)
    </script>
</head>

<body>
    <header>
        <h1>I miei animali Preferiti</h1>
    </header>
    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale">
        </figure>
        <div class="lista-animali"></div>
    </main>
    <footer>
        <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>
</body>

</html>
